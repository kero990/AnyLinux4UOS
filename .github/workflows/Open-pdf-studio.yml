name: Open-PDF-Studio

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.platform.runner }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps: 
     
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2
        
      - name: Install Dependencies
        run:  |
          pacman -Syu --noconfirm readest
          get-debloated-pkgs --add-common --prefer-nano

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: false
          package-manager-cache: true

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - run: git clone https://github.com/OpenAEC-Foundation/open-pdf-studio --depth 1
      - run: cd open-pdf-studio/open-pdf-studio && npm ci
      - run: |
          echo "VERSION=$(curl -s https://api.github.com/repos/OpenAEC-Foundation/open-pdf-studio/releases/latest | jq -r .tag_name)"  >> $GITHUB_ENV
          cd open-pdf-studio && cargo build --release -p pdfium-worker
          mkdir -p open-pdf-studio/src-tauri/binaries
          cp target/release/pdfium-worker open-pdf-studio/src-tauri/binaries/pdfium-worker-x86_64-unknown-linux-gnu
          
      - name: Fetch libpdfium.so
        run: |
          cd open-pdf-studio
          mkdir -p src-tauri/binaries/linux-x64
          curl -L "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7834/pdfium-linux-${{ matrix.platform.arch }}.tgz" -o /tmp/pdfium-linux.tgz
          tar xzf /tmp/pdfium-linux.tgz -C /tmp lib/libpdfium.so
          cp /tmp/lib/libpdfium.so src-tauri/binaries/linux-x64/libpdfium.so

      - name: Build App
        uses: tauri-apps/tauri-action@action-v0.6.1
        with:
          projectPath: open-pdf-studio/open-pdf-studio
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          includeDebug: false
          includeRelease: true
          updaterJsonKeepUniversal: false
          isGitea: false
          uploadPlainBinary: false
          generateReleaseNotes: false
        env:
          CARGO_HOME: /home/runner/.cargo
          CARGO_INCREMENTAL: 0
          CARGO_TERM_COLOR: always

      - name: prepare AppDir
        run: |
          cd open-pdf-studio
          mkdir dist && cd dist
          cp '../target/release/bundle/appimage/Open PDF Studio.AppDir/Open PDF Studio.desktop' .
          cp '../target/release/bundle/appimage/Open\ PDF\ Studio.AppDir/Open PDF Studio.png' .
          cp ../target/release/open-pdf-studio .
          cp ../target/release/pdfium-worker .
          mkdir AppDir/bin -p
          cp ../src-tauri/binaries/linux-x64/libpdfium.so AppDir/bin
          cp ../target/release/kaders AppDir/bin

      - name: quick-sharun
        run: |
          cd open-pdf-studio/dist
          export DESKTOP='Open PDF Studio.desktop' ICON='Open PDF Studio.png'
          quick-sharun open-pdf-studio pdfium-worker

          quick-sharun --make-appimage
          mv *.AppImage $GITHUB_WORKSPACE/ || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-pdf-studio-${{ env.VERSION }}-${{ matrix.platform.arch }}
          path: "*.AppImage"

          
  release:
    needs: build # 确保所有架构编译成功后再创建 Release
    runs-on: ubuntu-latest
    steps:
      - name: get version again
        run: echo "VERSION=$(curl -s https://api.github.com/repos/OpenAEC-Foundation/open-pdf-studio/releases/latest | jq -r .tag_name)"  >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: open-pdf-studio*
          merge-multiple: true # 将所有下载的文件解压到同个目录

      - name: Create Combined Release
        uses: ncipollo/release-action@v1
        with:
          name: open-pdf-studio ${{ env.VERSION }}
          tag: open-pdf-studio_${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "*.AppImage"       
          
